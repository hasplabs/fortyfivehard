<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="apple-itunes-app" content="app-id=6811716562">
<title>45 Hard — You're invited</title>
<meta property="og:title" content="You're invited to 45 Hard" />
<meta property="og:description" content="Get the app and add your friend." />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://hasplabs.github.io/fortyfivehard/icon.png" />
<link rel="stylesheet" href="site.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="mark" aria-hidden="true">45</div>
      <h1>45 Hard</h1>
    </header>

    <section>
      <h2 id="heading">You're invited to 45 Hard</h2>
      <p>45 Hard is a 45-day habit challenge. Pick your goals, log every one of them every day, and keep the streak.</p>
      <p><a class="btn" href="https://apps.apple.com/app/id6811716562">Get 45 Hard on the App Store</a></p>
      <p class="small" id="add" hidden>Already have the app? <a id="add-link" href="#"></a></p>
      <p class="small">Need help? Email <a href="mailto:contact@hasplabs.com">contact@hasplabs.com</a>.</p>
    </section>

    <footer>
      <p><a href="support.html">← Back to 45 Hard support</a></p>
    </footer>
  </div>
  <script>
    (function () {
      // The invite link is invite.html?h=<handle>, and from 1.6.0 on also carries d, the UTC day
      // the link was made. The handle is used only when it matches the rule claim_handle
      // enforces, and it is written only through textContent and the link's href property, so
      // nothing from the address reaches the markup. A missing h reads as '' rather than null:
      // the regex would coerce null to the string "null" and accept it. The day is handed to the
      // app only when it has the YYYY-MM-DD form; anything else is dropped, so a damaged day
      // makes the link act as one with no day. The page never shows the day.
      var h = new URLSearchParams(location.search).get('h') || '';
      var d = new URLSearchParams(location.search).get('d') || '';
      if (!/^[a-z0-9_]{3,20}$/.test(h)) return;
      document.getElementById('heading').textContent = '@' + h + ' invited you to 45 Hard';
      var addLink = document.getElementById('add-link');
      addLink.textContent = 'Add @' + h;
      addLink.href = 'fortyfivehard://friends/add?handle=' + h + (/^\d{4}-\d{2}-\d{2}$/.test(d) ? '&date=' + d : '');
      document.getElementById('add').hidden = false;
    })();
  </script>
</body>
</html>
